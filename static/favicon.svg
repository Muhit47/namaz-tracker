<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ntSlateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ntStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Squircle Base Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ntSlateBg)" stroke="#334155" stroke-width="1.2"/>
  
  <!-- Balanced NT Monogram with T crossbar perfectly matching boxed width -->
  <g fill="none" stroke="url(#ntStrokeGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <!-- Letter N: Fluid calligraphic curve -->
    <path d="M17 43.5 V23.5 C17 20.5 19.5 19.5 21.5 21 L31.5 38 V21" />
    
    <!-- Letter T Crossbar: Perfectly bounded from x=26.5 to x=49.5 across boxed width -->
    <path d="M26.5 21 H49.5" />
    
    <!-- Letter T Stem: Original Calligraphic curve with bottom flourish -->
    <path d="M39 21 V38 C39 42 41.5 44 45 42.5" />
  </g>
  
  <!-- Islamic Nuqta / Diamond Accent Dot -->
  <rect x="28.5" y="10.5" width="4.5" height="4.5" rx="1" transform="rotate(45 30.75 12.75)" fill="#94A3B8"/>
</svg>
